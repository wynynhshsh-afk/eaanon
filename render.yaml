services:
  - type: web
    name: anonbot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: SPLUS_BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: WEBHOOK_URL
        value: https://anonbot.onrender.com
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /healthz
